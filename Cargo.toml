[package]
name = "moto-manager-api"
version = "0.19.0"
edition = "2021"
license-file = "LICENSE"

[[bin]]
name = "moto-manager-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "tls-native-tls", "macros", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
# Held at 0.5 — argon2 0.5.3 is still the latest *stable* release and requires
# password-hash ^0.5 (argon2 0.6 is pre-release only, 0.6.0-rc.8 as of 2026-08).
# Bump both together once argon2 0.6.0 ships.
password-hash = { version = "0.5", features = ["getrandom"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
http = "1"
futures = "0.3"
anyhow = "1"
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
# `default-features = false` drops the `tonic` feature (on by default in 0.8),
# which would otherwise pull the whole gRPC stack plus a second tower-http copy
# into the tree. Only the axum integration is used here.
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
base64 = "0.23.1"
url = "2.5.8"
pdfium-render = "0.9.3"
# Outbound HTTP, used only to fetch part images from allowlisted hosts (BMWBike import).
# Held at 0.12 — 0.13 renames the `rustls-tls` feature to `rustls` and switches the
# default crypto provider to aws-lc-rs, which needs cmake and a C toolchain in the
# builder image. That contradicts the pure-Rust/cross-arch constraint the tar+flate2
# choice below is built around. Revisit if reqwest exposes a ring-backed default again.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
# Backup archiving. Both are pure-Rust (flate2 defaults to the miniz_oxide
# backend) so they cross-compile cleanly in the arm64/amd64 Docker build with
# no extra C toolchain — unlike a zstd-sys dependency.
tar = "0.4"
flate2 = "1"
# Content fingerprint (pure-Rust) so a scheduled backup can skip when nothing
# changed since the last one.
sha2 = "0.11"
