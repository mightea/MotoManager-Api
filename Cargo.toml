[package]
name = "moto-manager-api"
version = "0.19.0"
edition = "2021"
license-file = "LICENSE"

[[bin]]
name = "moto-manager-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "tls-native-tls", "macros", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.6"
# argon2 and password-hash must move together (argon2 0.6 requires password-hash ^0.6).
password-hash = { version = "0.6", features = ["getrandom"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
http = "1"
futures = "0.3"
anyhow = "1"
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
# `default-features = false` drops the `tonic` feature (on by default in 0.8),
# which would otherwise pull the whole gRPC stack plus a second tower-http copy
# into the tree. Only the axum integration is used here.
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
base64 = "0.23.1"
url = "2.5.8"
pdfium-render = "0.9.3"
# Outbound HTTP, used only to fetch part images from allowlisted hosts (BMWBike import).
# `rustls-no-provider` instead of the default `rustls` feature: the default pulls in
# aws-lc-rs, which needs cmake and a C toolchain in the builder image. The ring
# provider below is what reqwest 0.12 used, and it is installed process-wide in
# `main` (and defensively where the client is built) so the TLS stack finds it.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
regex = "1"
# Backup archiving. Both are pure-Rust (flate2 defaults to the miniz_oxide
# backend) so they cross-compile cleanly in the arm64/amd64 Docker build with
# no extra C toolchain — unlike a zstd-sys dependency.
tar = "0.4"
flate2 = "1"
# Content fingerprint (pure-Rust) so a scheduled backup can skip when nothing
# changed since the last one.
sha2 = "0.11"
# MCP server (Streamable HTTP transport, mounted at /mcp). Pure-Rust.
rmcp = { version = "3.2", features = ["transport-streamable-http-server"] }
