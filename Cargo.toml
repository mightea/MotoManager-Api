[package]
name = "moto-manager-api"
version = "0.10.0"
edition = "2021"
license-file = "LICENSE"

[[bin]]
name = "moto-manager-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "tls-native-tls", "macros", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
# Held at 0.5 — argon2 0.5.3 (latest) requires password-hash ^0.5; bump together when argon2 0.6 releases.
password-hash = { version = "0.5", features = ["getrandom"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
http = "1"
futures = "0.3"
anyhow = "1"
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
tower_governor = "0.7"
base64 = "0.22.1"
url = "2.5.8"
pdfium-render = "0.9.1"
# Outbound HTTP, used only to fetch part images from allowlisted hosts (BMWBike import).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
# Backup archiving. Both are pure-Rust (flate2 defaults to the miniz_oxide
# backend) so they cross-compile cleanly in the arm64/amd64 Docker build with
# no extra C toolchain — unlike a zstd-sys dependency.
tar = "0.4"
flate2 = "1"
