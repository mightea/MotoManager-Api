name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev sqlite3
      
      - name: Set up database for sqlx macros
        run: |
          # Apply ALL migrations in order so the compile-time sqlx macros are
          # checked against the real (latest) schema. Globbing keeps this
          # drift-proof: new migrations are picked up automatically.
          for f in migrations/*.sql; do
            echo "Applying $f"
            sqlite3 db.sqlite < "$f"
          done
          echo "DATABASE_URL=sqlite:$(pwd)/db.sqlite" >> $GITHUB_ENV
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          
      - uses: Swatinem/rust-cache@v2
      
      - name: Rustfmt
        run: cargo fmt --all -- --check
        
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev sqlite3
      
      - name: Set up database for sqlx macros
        run: |
          # Apply ALL migrations in order so the compile-time sqlx macros are
          # checked against the real (latest) schema. Globbing keeps this
          # drift-proof: new migrations are picked up automatically.
          for f in migrations/*.sql; do
            echo "Applying $f"
            sqlite3 db.sqlite < "$f"
          done
          echo "DATABASE_URL=sqlite:$(pwd)/db.sqlite" >> $GITHUB_ENV
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - uses: Swatinem/rust-cache@v2
      
      - name: Run tests
        run: cargo test --verbose
