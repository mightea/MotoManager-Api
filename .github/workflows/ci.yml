name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev sqlite3
      
      - name: Set up database for sqlx macros
        run: |
          # Apply ALL migrations in order so the compile-time sqlx macros are
          # checked against the real (latest) schema. Globbing keeps this
          # drift-proof: new migrations are picked up automatically.
          for f in migrations/*.sql; do
            echo "Applying $f"
            sqlite3 db.sqlite < "$f"
          done
          echo "DATABASE_URL=sqlite:$(pwd)/db.sqlite" >> $GITHUB_ENV
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          
      - uses: Swatinem/rust-cache@v2
      
      - name: Rustfmt
        run: cargo fmt --all -- --check
        
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev sqlite3
      
      - name: Set up database for sqlx macros
        run: |
          # Apply ALL migrations in order so the compile-time sqlx macros are
          # checked against the real (latest) schema. Globbing keeps this
          # drift-proof: new migrations are picked up automatically.
          for f in migrations/*.sql; do
            echo "Applying $f"
            sqlite3 db.sqlite < "$f"
          done
          echo "DATABASE_URL=sqlite:$(pwd)/db.sqlite" >> $GITHUB_ENV
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --verbose

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the coverage badge to the `badges` branch (main only)
      pull-requests: write # post the coverage comment on PRs
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev sqlite3

      - name: Set up database for sqlx macros
        run: |
          # Same as the test job: compile-time sqlx macros need the real schema.
          for f in migrations/*.sql; do
            sqlite3 db.sqlite < "$f"
          done
          echo "DATABASE_URL=sqlite:$(pwd)/db.sqlite" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        run: |
          cargo llvm-cov --no-report --workspace
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee cov-summary.txt
          PCT=$(cargo llvm-cov report --json | jq -r '.data[0].totals.lines.percent')
          echo "COV_PCT=$PCT" >> "$GITHUB_ENV"

      - name: Build coverage comment
        if: github.event_name == 'pull_request'
        run: |
          {
            printf '## 🦀 Backend test coverage\n\n'
            printf '**Lines: %.2f%%**\n\n' "$COV_PCT"
            printf '<details><summary>Full summary</summary>\n\n```\n'
            cat cov-summary.txt
            printf '```\n\n</details>\n\n<sub>cargo-llvm-cov · updated on every push</sub>\n'
          } > coverage-comment.md

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: backend-coverage
          path: coverage-comment.md

      - name: Update coverage badge (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INT=${COV_PCT%.*}
          if   [ "$INT" -ge 90 ]; then COLOR=brightgreen
          elif [ "$INT" -ge 80 ]; then COLOR=green
          elif [ "$INT" -ge 70 ]; then COLOR=yellowgreen
          elif [ "$INT" -ge 60 ]; then COLOR=yellow
          elif [ "$INT" -ge 50 ]; then COLOR=orange
          else COLOR=red; fi
          PCT=$(printf '%.1f' "$COV_PCT")
          curl -sSL "https://img.shields.io/badge/coverage-${PCT}%25-${COLOR}?style=flat" -o coverage.svg
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          work=$(mktemp -d)
          cp coverage.svg "$work/coverage.svg"
          cd "$work"
          git init -q -b badges
          git add coverage.svg
          git commit -q -m "chore: update coverage badge [skip ci]"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
