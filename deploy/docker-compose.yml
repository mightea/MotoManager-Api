# The API backs itself up in-process (VACUUM INTO snapshot + tar.gz of the upload
# dirs), on a schedule and on-demand from the webapp admin area — no sidecar
# needed. Archives are written to DATA_DIR/backups inside the `data` volume.
services:
  api:
    image: ghcr.io/tobias/moto-manager-api:latest   # adjust to your image ref
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: sqlite:/app/data/db.sqlite
      DATA_DIR: /app/data
      CACHE_DIR: /app/cache
      RP_ID: your.domain
      ORIGIN: https://your.domain
      # Public URL of the API itself (OAuth issuer for MCP connector clients).
      PUBLIC_URL: https://api.your.domain
      ENABLE_REGISTRATION: "false"
      RUST_LOG: info
      # Automatic backups (admins can also trigger/download from the webapp).
      BACKUP_ENABLED: "true"
      BACKUP_INTERVAL_HOURS: "24"
      BACKUP_KEEP: "14"
      # Set to the frontend image tag so scheduled backups record the frontend
      # version too (manual backups already send it). Keep in sync on deploy.
      FRONTEND_VERSION: "2026.7.3"
      # LLM_BASE_URL / LLM_MODEL / LLM_API_KEY as needed
      # Optional Host allowlist for the MCP endpoint (/mcp); empty = disabled.
      # MCP_ALLOWED_HOSTS: "api.your.domain"
    volumes:
      - data:/app/data
      - cache:/app/cache
      # OPTIONAL: also expose the backup archives on the host (ideally a
      # different physical disk) so you can pull them offsite. The app writes
      # them under DATA_DIR/backups regardless of this mount.
      # - /mnt/backup/motomanager:/app/data/backups

volumes:
  data:
  cache:

# Offsite (recommended next step): the archives are self-contained .tar.gz files.
# Once the optional host mount above is enabled, a cron'd `rclone copy
# /mnt/backup/motomanager remote:motomanager-backups` ships them off the box.
